name: Build and Push Gemoe Image

on:
  push:
    paths:
      - "Gemoe/**"

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: arakurumi/bot
  CONTEXT_SUFFIX: Gemoe

jobs:
  meta:
    name: Prepare Metadata

    runs-on: ubuntu-26.04

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Set Up Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            gemoe
          images: |
            arakurumi/bot
          labels: |
            org.opencontainers.image.authors=Kurumi <kqruumi@gmail.com>
            org.opencontainers.image.description=Docker Images for My Bot
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=Docker-Bot
            org.opencontainers.image.version={{date 'YYYYMMDD'}}

  build:
    name: Build (${{ matrix.platform }})

    needs: meta

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - name: Set Up BUILDX
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Cache Bust
        id: cache-bust
        run: echo "daily=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build and Push by Digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:${{ env.CONTEXT_SUFFIX }}"
          platforms: ${{ matrix.platform }}
          build-args: |
            CACHE_BUST=${{ steps.cache-bust.outputs.daily }}
          cache-from: type=gha,scope=${{ env.CONTEXT_SUFFIX }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ env.CONTEXT_SUFFIX }}-${{ matrix.arch }}
          provenance: false
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export Digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload Digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.CONTEXT_SUFFIX }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish Multi-Arch Manifest

    needs:
      - meta
      - build

    runs-on: ubuntu-26.04

    steps:
      - name: Download Digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ env.CONTEXT_SUFFIX }}-*
          merge-multiple: true

      - name: Set Up BUILDX
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create Manifest List
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=""
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args="$tag_args --tag $tag"
          done <<< "$TAGS"
          docker buildx imagetools create $tag_args \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)

  verify:
    name: Verify Image

    needs:
      - meta
      - merge

    runs-on: ubuntu-26.04

    steps:
      - name: Pull Image
        run: docker pull ${{ needs.meta.outputs.tags }}

      - name: Verify Python Environments
        run: |
          docker run --rm ${{ needs.meta.outputs.tags }} /bin/sh -c '
            fail=0
            green="\033[1;32m"
            red="\033[1;31m"
            bold="\033[1m"
            dim="\033[2m"
            reset="\033[0m"

            printf "\n  ${bold}Verifying Gemoe image${reset}\n"
            printf "  ${dim}--------------------------------------------------${reset}\n"

            if /gemoe/bin/python -V >/dev/null 2>&1; then
              printf "  ${green}✔${reset}  %-24s %s\n" "gemoe venv" "$(/gemoe/bin/python -V 2>&1)"
            else
              fail=$((fail + 1))
              printf "  ${red}✖${reset}  %-24s %s\n" "gemoe venv" "missing"
            fi

            if /librespot/bin/python -c "import librespot" >/dev/null 2>&1; then
              printf "  ${green}✔${reset}  %-24s %s\n" "librespot venv" "imported"
            else
              fail=$((fail + 1))
              printf "  ${red}✖${reset}  %-24s %s\n" "librespot venv" "import failed"
            fi

            for module in bs4 Crypto gallery_dl lxml mutagen PIL pycurl pyrogram requests tenacity yt_dlp; do
              if /gemoe/bin/python -c "import $module" >/dev/null 2>&1; then
                printf "  ${green}✔${reset}  %-24s %s\n" "$module" "imported"
              else
                fail=$((fail + 1))
                printf "  ${red}✖${reset}  %-24s %s\n" "$module" "import failed"
              fi
            done

            printf "  ${dim}--------------------------------------------------${reset}\n"
            if [ "$fail" -gt 0 ]; then
              printf "  ${red}✖${reset}  %d check(s) failed\n" "$fail"
              exit 1
            fi
            printf "  ${green}✔${reset}  Environment verified\n"
          '
